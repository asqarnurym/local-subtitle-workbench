name: Scientific module CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Select Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install uv
        uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          version: "0.12.24"
          enable-cache: true
      - name: Restore locked environment
        run: uv sync --locked
      - name: Lint
        run: uv run --locked ruff check .
      - name: Formatting
        run: uv run --locked ruff format --check .
      - name: Unit and integration tests
        run: uv run --locked pytest --junitxml=test-results.xml
      - name: Build wheel
        run: uv run --locked python -m build --wheel --no-isolation
      - name: Installed wheel offline smoke
        shell: bash
        run: uv run --locked python scripts/smoke_wheel.py --wheel dist/*.whl --output wheel-demo
      - name: Retain reproducible delivery evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: delivery-python-${{ matrix.python-version }}
          path: |
            dist/*.whl
            test-results.xml
            wheel-demo/
