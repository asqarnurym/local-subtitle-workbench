[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[project]
name = "local-subtitle-workbench"
version = "0.1.0"
description = "Offline audio subtitle synchronization workbench: Faster-Whisper ASR, Silero-VAD, banded DTW, MFA/CTC forced alignment, FastAPI microservice, and Docker packaging"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = "MIT"
authors = [{name = "Askar Nurym"}]
dependencies = ["numpy>=2.1,<3"]

[project.optional-dependencies]
speech = [
    "faster-whisper>=1.0.0",
    "torch>=2.2.0",
]
api = [
    "fastapi>=0.162.0",
    "httpx>=0.28.1",
    "python-multipart>=0.0.32",
    "uvicorn>=0.54.0",
]

[project.scripts]
subtitle-workbench = "subtitle_workbench.cli:main"

[dependency-groups]
dev = ["pytest>=8.3,<9", "ruff>=0.11,<1", "build>=1.2,<2", "hatchling==1.32.4"]

[tool.hatch.build.targets.wheel]
packages = ["src/subtitle_workbench"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
